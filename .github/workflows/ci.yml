name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[text,dev]"
      - name: Tests
        id: tests
        run: pytest -q --junitxml=report.xml

      # Publish each failure as an annotation: those are readable without
      # downloading logs, which matters when a platform-specific failure has to
      # be diagnosed from outside (e.g. Windows from a macOS workstation).
      - name: Report failures
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          path = "report.xml"
          if not os.path.exists(path):
              print("::error title=no junit report::pytest produced no report.xml")
              raise SystemExit(0)
          tree = ET.parse(path)
          shown = 0
          for case in tree.iter("testcase"):
              # NOT `case.find("failure") or case.find("error")`: a childless
              # <failure/> element is falsy, so that idiom skipped every failure.
              problem = case.find("failure")
              if problem is None:
                  problem = case.find("error")
              if problem is None:
                  continue
              shown += 1
              msg = (problem.get("message") or "").strip().replace("\n", " ")[:180]
              print("::error title=%s::%s" % (case.get("name"), msg or "failed"))
          print("::notice::%d failing test(s) on this platform" % shown)
          PY
      # `python -m` rather than the console script: on Windows the script lands
      # in Scripts\ which Git Bash does not always inherit, and a "command not
      # found" here used to be the only visible signal.
      - name: CLI smoke test
        id: smoke
        shell: bash
        run: |
          set -e
          python -m gchat_archive --version
          python -m gchat_archive --help > /dev/null
          if ! out=$(python -m gchat_archive doctor 2>&1); then
            echo "::error title=doctor failed on this platform::$(echo "$out" | tr '\n' ' ' | tail -c 400)"
            exit 1
          fi
          echo "$out"
      # End-to-end on the platform itself: start the server, fetch the UI, probe
      # the scheduler/service code paths (read-only), in a temp data directory.
      - name: Runtime smoke test
        run: python scripts/smoke.py

      - name: Build wheel
        id: build
        run: |
          pip install build
          python -m build --wheel

      - name: Diagnose
        if: failure()
        shell: bash
        run: |
          echo "::error title=which step failed::install=${{ steps.install.outcome }} tests=${{ steps.tests.outcome }} smoke=${{ steps.smoke.outcome }} build=${{ steps.build.outcome }}"
          echo "::error title=interpreter::$(python -c 'import sys,platform;print(sys.executable, platform.platform())')"
          echo "::error title=console script::$(command -v gchat-archive || echo 'not on PATH')"
