name: release

# Publishing without a local twine install: push a tag and GitHub uploads to PyPI
# with a short-lived OIDC token. One-time setup on PyPI:
#   Your project → Publishing → add a GitHub publisher
#     owner: tunguyenatwork   repo: gchat-archive
#     workflow: release.yml   environment: pypi
# Until such a publisher exists this job fails at the upload step — by design,
# it cannot publish on your behalf otherwise.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: build + publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # OIDC token for trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check the metadata
        run: |
          pip install twine
          python -m twine check dist/*

      - name: Install the built wheel and smoke-test the CLI
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          /tmp/check/bin/gchat-archive --help
          /tmp/check/bin/gchat-archive doctor || true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
