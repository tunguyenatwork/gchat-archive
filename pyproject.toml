[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gchat-archive"
version = "0.2.2"
description = "Keep a local, searchable copy of your Google Chat history"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gchat-archive contributors" }]
keywords = ["google-chat", "archive", "offline", "sqlite", "fts5", "backup"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Chat",
  "Topic :: Database",
]
dependencies = [
  "google-auth>=2.0,<3",
]

[project.optional-dependencies]
text = [
  "pypdf>=4.0,<6",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "beautifulsoup4>=4.12,<5",
]
browser = [
  "websocket-client>=1.7,<2",
]
dev = [
  "pytest>=8.0,<9",
  "pyflakes>=3.2,<4",
]

[project.scripts]
gchat-archive = "gchat_archive.cli:main"

[project.urls]
Homepage = "https://github.com/yourname/gchat-archive"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gchat_archive = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
